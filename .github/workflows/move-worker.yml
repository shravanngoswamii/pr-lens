name: Move the bot worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  move:
    if: github.repository == 'shravanngoswamii/pr-lens' && github.ref == 'refs/heads/main' && github.actor_id == '123811742'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Move credentials to the bot repository
        run: |
          test "$(gh api user --jq .id)" = 288567261
          test "$(gh api repos/shravangoswami-bot/pr-lens-reports --jq .permissions.admin)" = true
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          printf '%s' "$GH_TOKEN" | gh secret set REVIEW_BOT_TOKEN --repo shravangoswami-bot/pr-lens-reports
          printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo shravangoswami-bot/pr-lens-reports
          gh secret list --repo shravangoswami-bot/pr-lens-reports --json name --jq '.[].name'
