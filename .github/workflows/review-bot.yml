name: Review pull requests
on:
  workflow_call:
    inputs:
      tool_repository:
        required: true
        type: string
      tool_ref:
        required: true
        type: string
      config_json:
        required: true
        type: string
      comment_url:
        type: string
        default: ''
      retry:
        type: boolean
        default: false
      check_subscription:
        type: boolean
        default: false
      check_cloud:
        type: boolean
        default: false
    secrets:
      REVIEW_BOT_TOKEN:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      CLAUDE_CODE_OAUTH_REFRESH_TOKEN:
        required: false
      CLAUDE_CLOUD_TRIGGERS:
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: review-bot
  cancel-in-progress: false
jobs:
  review:
    if: vars.REVIARY_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      DISABLE_AUTOUPDATER: '1'
      REVIEW_BOT_CONFIG: ${{ inputs.config_json }}
      CLOUD_REVIEW: ${{ fromJSON(inputs.config_json).cloud && 'true' || 'false' }}
      CHECK_CLOUD: ${{ inputs.check_cloud }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.tool_repository }}
          ref: ${{ inputs.tool_ref }}
          persist-credentials: false
      - name: Check credentials
        run: |
          test -n "$GH_TOKEN" || { echo 'Set REVIEW_BOT_TOKEN'; exit 1; }
          if [ "$CLOUD_REVIEW" != true ] && [ "$CHECK_CLOUD" != true ]; then
            test -n "$CLAUDE_CODE_OAUTH_TOKEN" || { echo 'Set CLAUDE_CODE_OAUTH_TOKEN'; exit 1; }
          fi
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache/restore@v6.1.0
        with:
          path: output/bot-state
          key: review-bot-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: review-bot-state-
      - name: Find review requests
        id: scan
        if: '!inputs.check_cloud'
        env:
          COMMENT_URL: ${{ inputs.comment_url }}
        run: node bot/hosted.js scan
      - uses: julia-actions/setup-julia@v3.0.3
        if: steps.scan.outputs.pending == 'true'
        with:
          version: '1.10'
      - run: npm ci
        if: steps.scan.outputs.pending == 'true' || inputs.check_cloud
      - name: Install Claude Code
        if: steps.scan.outputs.pending == 'true' || inputs.check_subscription || inputs.check_cloud
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.322
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prepare Claude cloud login
        if: inputs.check_cloud || (fromJSON(inputs.config_json).cloud && (steps.scan.outputs.pending == 'true' || inputs.check_subscription))
        env:
          CLAUDE_CODE_OAUTH_REFRESH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_REFRESH_TOKEN }}
          CLAUDE_CODE_OAUTH_SCOPES: ${{ vars.CLAUDE_CODE_OAUTH_SCOPES }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_REFRESH_TOKEN" ]; then
            node bot/cloud-auth.js login "$GITHUB_REPOSITORY"
          else
            node bot/cloud.js
          fi
      - name: Check cloud task credentials
        if: inputs.check_cloud && fromJSON(inputs.config_json).cloud
        env:
          CLAUDE_CLOUD_TRIGGERS: ${{ secrets.CLAUDE_CLOUD_TRIGGERS }}
        run: |
          node --input-type=module - <<'JS'
          import { cloudCreator } from './bot/cloud-review.js';
          const config = JSON.parse(process.env.REVIEW_BOT_CONFIG);
          for (const key of Object.keys(config.cloud.triggers)) {
            const [model, effort] = key.split('/');
            cloudCreator(config, model, effort, {});
            console.log(`Cloud task credentials configured: ${key}`);
          }
          JS
      - run: npx playwright install chromium
        if: steps.scan.outputs.pending == 'true'
      - name: Prepare publishing checkout
        if: steps.scan.outputs.pending == 'true'
        run: node bot/hosted.js setup
      - name: Review requests
        if: steps.scan.outputs.pending == 'true'
        env:
          COMMENT_URL: ${{ inputs.comment_url }}
          RETRY: ${{ inputs.retry }}
          CLAUDE_CLOUD_TRIGGERS: ${{ secrets.CLAUDE_CLOUD_TRIGGERS }}
        run: |
          if [ -n "$COMMENT_URL" ]; then
            mode=run
            if [ "$RETRY" = true ]; then mode=retry; fi
            node bin/review-bot.js "$mode" output/bot-hosted.json --comment "$COMMENT_URL"
          else
            node bin/review-bot.js once output/bot-hosted.json
          fi
      - name: Check Claude subscription
        if: inputs.check_subscription
        run: |
          node --input-type=module - <<'JS'
          import { mkdtemp } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { askClaude } from './bot/claude.js';
          const { model, effort } = JSON.parse(process.env.REVIEW_BOT_CONFIG);
          const result = await askClaude('Return exactly {"files":[]}. This checks subscription authentication.', await mkdtemp(join(tmpdir(), 'reviary-check-')), undefined, { model, effort, onModels: names => console.log(`Claude models: ${names.join(', ') || 'unreported'}`) });
          if (!Array.isArray(result.files) || result.files.length) throw new Error('Subscription check did not complete');
          console.log('Claude subscription request completed.');
          JS
      - name: Compact checkpoint
        if: always()
        run: node bot/hosted.js compact
      - uses: actions/cache/save@v6.1.0
        if: always() && hashFiles('output/bot-state/state.json') != ''
        with:
          path: output/bot-state
          key: review-bot-state-${{ github.run_id }}-${{ github.run_attempt }}
